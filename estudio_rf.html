    let currentRfKey = 'rf01';
    let currentFileIndex = 0;

    document.addEventListener('DOMContentLoaded', () => {
      renderRfTabs();
      loadRequirement(currentRfKey);
    });

    function renderRfTabs() {
      const container = document.getElementById('rf-tabs-bar');
      container.innerHTML = '';
      Object.keys(DATA).forEach(key => {
        const rf = DATA[key];
        const btn = document.createElement('button');
        btn.id = `btn-rf-${key}`;
        btn.onclick = () => loadRequirement(key);
        btn.className = `tab-rf-btn ${key === currentRfKey ? 'active' : ''}`;
        btn.textContent = `${rf.code}: ${rf.badge}`;
        container.appendChild(btn);
      });
    }

    function loadRequirement(rfKey) {
      currentRfKey = rfKey;
      currentFileIndex = 0;

      Object.keys(DATA).forEach(key => {
        const btn = document.getElementById(`btn-rf-${key}`);
        if (btn) btn.className = `tab-rf-btn ${key === currentRfKey ? 'active' : ''}`;
      });

      const rf = DATA[rfKey];
      document.getElementById('rf-title-badge').textContent = `${rf.code} - ${rf.badge}`;

      renderFileTabs();
      renderCards();
    }

    function renderFileTabs() {
      const container = document.getElementById('file-tabs-bar');
      container.innerHTML = '';
      const rf = DATA[currentRfKey];

      rf.files.forEach((file, index) => {
        const btn = document.createElement('button');
        btn.onclick = () => {
          currentFileIndex = index;
          renderFileTabs();
          renderCards();
        };
        btn.className = `file-tab-btn ${index === currentFileIndex ? 'active' : ''}`;
        btn.textContent = file.name;
        container.appendChild(btn);
      });
    }

    function renderCards() {
      const container = document.getElementById('cards-container');
      container.innerHTML = '';
      const rf = DATA[currentRfKey];
      const file = rf.files[currentFileIndex];

      document.getElementById('line-counter-text').textContent = `${file.lines.length} líneas explicadas`;

      file.lines.forEach((item) => {
        const card = document.createElement('div');
        card.className = 'line-card';

        const isEmpty = item.code.trim() === '';
        const codeText = isEmpty ? '// Línea en blanco (separador de código)' : escapeHtml(item.code);

        card.innerHTML = `
          <div class="card-top">
            <span class="file-path-tag">${item.file}</span>
            <span class="line-number-pill">Línea ${item.num}</span>
          </div>

          <div class="code-box ${isEmpty ? 'empty-line' : ''}">${codeText}</div>

          <div class="section-plain">
            <div class="section-label-plain">👉 ¿Qué hace en cristiano?</div>
            <div class="section-text-plain">${item.plain}</div>
          </div>

          <div class="section-jury">
            <div class="section-label-jury">🎤 Dilo al jurado</div>
            <div class="section-text-jury">"${item.jury}"</div>
          </div>
        `;

        container.appendChild(card);
      });

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
